name: CI

permissions:
  contents: read

on:
  workflow_dispatch: { }
  push:
    branches: [ '2.3-gae' ]
  pull_request:
    branches: [ '2.3-gae' ]

jobs:
  build:
    strategy:
        matrix:
            os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    concurrency: main_tests_${{ github.ref }}_${{ matrix.os }}
    steps:
      - name: Welcome Message
        run: 'echo "Started with parameters: ${{ matrix.os }} because ${{ github.event_name }} on ${{ github.ref }}"'
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
      - name: Set up JDK 16
        uses: actions/setup-java@v4
        with:
          java-version: 16
          distribution: zulu
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle
      - name: Validate Gradle wrapper
        # See latest versions here: https://github.com/gradle/actions/releases
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Run Build
        id: build_step
        run: './gradlew "-Pfreemarker.signMethod=none" "-Pfreemarker.allowUnsignedReleaseBuild=true" --continue clean build'
      - name: Set up GraalVM 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: graalvm
        # Test pipeline to check GraalVM native image support:
        #
        # - GraalVM 21 is added to the runner
        # - The freemarker-test-graalvm-native executable is built (nativeCompile) and executed
        # - The JUnit 5 native test suite is compiled and executed as a native image (nativeTest),
        #   exercising a broad percentage of the FreeMarker codebase across core directives,
        #   ranges/slicing, variadic/recursive macros and functions, built-ins, lambdas, dynamic
        #   evaluation (?eval, ?eval_json, ?interpret), BeansWrapper (Java records, enums, static
        #   models, overloaded methods, default/whitelist/blacklist/legacy member access policies),
        #   template loaders (#include, #import, auto_include, auto_import), TemplateConfiguration
        #   matchers, output formats, custom directives/methods, custom number/date formats,
        #   arithmetic engines, exception handlers, XML DOM NodeModel, Properties-based
        #   configuration, and logger resolution.
      - name: Test GraalVM native support (build and run)
        id: native_test
        if: runner.os != 'Windows'
        run: |
          ./gradlew :freemarker-test-graalvm-native:nativeCompile
          ./freemarker-test-graalvm-native/build/native/nativeCompile/freemarker-test-graalvm-native
          ./gradlew :freemarker-test-graalvm-native:nativeTest
      - name: Upload Failed Report
        uses: actions/upload-artifact@v4
        if: failure() && steps.build_step.outcome == 'failure'
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/**
          retention-days: 30
